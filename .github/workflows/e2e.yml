# Real run of one e2e suite against a live stand, started by hand from the Actions tab.
#
# No stand exists for this project, so this workflow is inert: it is kept correct and ready,
# but it can only pass once the repository secrets below point at a real stand. Until then
# the e2e suites are verified structurally by `ci.yml` (`playwright test --list`).
name: E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite (Playwright project) to run
        type: choice
        options: [api, cms, ui]
        default: api
      browser:
        description: Browser for the cms/ui suites (ignored for api)
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium
      viewport:
        description: Viewport as WIDTHxHEIGHT
        type: string
        default: 1920x1080
      faker_seed:
        description: Faker seed to replay a previous run (empty = random)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Suites create and delete real entities on the shared stand; never run two at once.
  group: e2e-stand
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # An unset secret or input still arrives as an empty string, which the settings schema
      # would read as a value (an empty URL fails validation, an empty seed coerces to 0).
      # Exporting only the non-empty ones lets optional settings fall back to their defaults.
      - name: Export stand configuration
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CMS_BASE_URL: ${{ secrets.CMS_BASE_URL }}
          CMS_API_BASE_URL: ${{ secrets.CMS_API_BASE_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          CMS_EMAIL: ${{ secrets.CMS_EMAIL }}
          CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}
          TEST_PAGE_PATH: ${{ secrets.TEST_PAGE_PATH }}
          REMOTE_BROWSER_WS: ${{ secrets.REMOTE_BROWSER_WS }}
          GLOBAL_SEARCH_PATH: ${{ secrets.GLOBAL_SEARCH_PATH }}
          VIEWPORT: ${{ inputs.viewport }}
          FAKER_SEED: ${{ inputs.faker_seed }}
        run: |
          for name in API_BASE_URL CMS_BASE_URL CMS_API_BASE_URL SITE_BASE_URL API_KEY \
            CMS_EMAIL CMS_PASSWORD TEST_PAGE_PATH REMOTE_BROWSER_WS GLOBAL_SEARCH_PATH \
            VIEWPORT FAKER_SEED; do
            if [ -n "${!name}" ]; then
              echo "$name=${!name}" >> "$GITHUB_ENV"
            fi
          done

      - name: Install Playwright browser
        if: inputs.suite != 'api'
        run: pnpm exec playwright install --with-deps ${{ inputs.browser }}

      - name: Run ${{ inputs.suite }} suite
        env:
          BROWSER: ${{ inputs.browser }}
        run: pnpm exec playwright test --project=${{ inputs.suite }} --retries=2

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
